<!doctype html>
<html lang="en" data-bs-theme="dark">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Connect Four - Bootstrap</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />
    </head>
    <body class="bg-body-tertiary">
        <nav class="navbar navbar-dark bg-dark">
            <div class="container">
                <span class="navbar-brand mb-0 h1">Connect Four</span>
                <span class="navbar-text">Bootstrap 5</span>
            </div>
        </nav>

        <main class="container py-4" style="max-width: 640px">
            <div
                id="status"
                class="alert alert-info d-flex justify-content-between align-items-center"
                role="status"
            >
                <span class="status-text">Player X, choose a column.</span>
                <span class="badge text-bg-primary" id="move-count">0 moves</span>
            </div>

            <div class="card shadow-sm">
                <div class="card-body text-center">
                    <table class="table table-borderless align-middle mb-0 w-auto mx-auto">
                        <tbody id="board"></tbody>
                    </table>
                </div>
            </div>

            <div class="btn-group w-100 mt-3" role="group" id="columns" aria-label="Columns"></div>

            <div class="d-grid mt-3">
                <button class="btn btn-outline-light" type="button" id="reset">New game</button>
            </div>
        </main>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="src/game.js"></script>
    </body>
</html>
