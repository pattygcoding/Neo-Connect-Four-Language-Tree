<!doctype html>
<html lang="en" class="h-full">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Connect Four - Tailwind CSS</title>
        <link rel="stylesheet" href="dist/output.css" />
    </head>
    <body class="min-h-full bg-slate-950 text-slate-100">
        <main class="mx-auto flex max-w-xl flex-col items-center gap-6 px-4 py-12">
            <h1 class="text-3xl font-bold tracking-tight">Connect Four</h1>

            <p id="status" role="status" class="text-lg text-slate-300"></p>

            <table class="rounded-xl bg-blue-800 p-2 shadow-xl">
                <tbody id="board"></tbody>
            </table>

            <div id="columns" class="grid grid-cols-7 gap-2"></div>

            <button
                id="reset"
                type="button"
                class="rounded-lg bg-mint-400 px-4 py-2 font-semibold text-slate-950 transition hover:brightness-110 active:scale-95"
            >
                New game
            </button>
        </main>

        <script type="module" src="/src/game.js"></script>
    </body>
</html>
